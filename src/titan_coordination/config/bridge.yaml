# ros_gz_bridge topic mapping configuration — AUTO-GENERATED by
# scripts/gen_bridge_config.py. Do not hand-edit — regenerate instead so
# all 5 robots stay consistent. See that script's docstring for why the
# per-robot topics are a straight passthrough except GPS.
#
# Docs: https://github.com/gazebosim/ros_gz/tree/ros2/ros_gz_bridge
# direction: GZ_TO_ROS = sensor data flowing out of Gazebo
#            ROS_TO_GZ = commands flowing into Gazebo

# ── Clock ──
# Syncs ROS 2 time with Gazebo sim time. Every node needs use_sim_time:=true.
- topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# ══════════════ leader ══════════════
# Drive commands: FISVFH/teleop/follower controller -> DiffDrive plugin.
- topic_name: "/leader/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ
# Wheel odometry from DiffDrive plugin -> EKF odom0 input.
- topic_name: "/leader/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS
# Wheel joint states, for completeness / future robot_state_publisher use.
- topic_name: "/leader/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS
# IMU -> EKF imu0 input.
- topic_name: "/leader/imu/data"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS
# 2D lidar -> FISVFH obstacle histogram.
- topic_name: "/leader/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS
# Camera -> fiducial tracking (Week 7-8).
- topic_name: "/leader/camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
# GPS: gz-side topic name differs from the ROS convention.
- ros_topic_name: "/leader/gps/fix"
  gz_topic_name: "/leader/navsat"
  ros_type_name: "sensor_msgs/msg/NavSatFix"
  gz_type_name: "gz.msgs.NavSat"
  direction: GZ_TO_ROS

